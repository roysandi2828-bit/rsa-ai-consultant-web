    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes marquee-left {
            0% { transform: translateX(0%); }
            100% { transform: translateX(calc(-100% - 1.5rem)); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(calc(-100% - 1.5rem)); }
            100% { transform: translateX(0%); }
        }
        .animate-marquee-left {
            animation: marquee-left 60s linear infinite;
        }
        .animate-marquee-right {
            animation: marquee-right 60s linear infinite;
        }

        /* Dark Mode (Default) */
        html[data-theme="dark"],
        html[data-theme="dark"] body {
            background-color: #0b0f19;
            color: #ffffff;
        }

        html[data-theme="dark"] .bg-dark {
            background-color: #0b0f19;
        }

        html[data-theme="dark"] .text-light {
            color: #ffffff;
        }

        /* Light Mode */
        html[data-theme="light"],
        html[data-theme="light"] body {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        html[data-theme="light"] .bg-dark {
            background-color: #f5f5f5;
        }

        html[data-theme="light"] .text-light {
            color: #1a1a1a;
        }

        html[data-theme="light"] .glass-effect {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        html[data-theme="light"] .text-gray-400 {
            color: #666666;
        }

        html[data-theme="light"] .text-gray-500 {
            color: #888888;
        }

        html[data-theme="light"] .border-white\/20 {
            border-color: rgba(0, 0, 0, 0.2);
        }

        html[data-theme="light"] .bg-white\/5 {
            background-color: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
