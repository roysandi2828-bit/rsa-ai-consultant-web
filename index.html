    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Default - Dark Mode */
        :root {
            color-scheme: dark;
        }

        html.light {
            color-scheme: light;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            @apply bg-[#0b0f19] text-white;
        }

        html.light body {
            @apply bg-white text-slate-900;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        html.light .glass-effect {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        html.light .gradient-bg {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0%); }
            100% { transform: translateX(calc(-100% - 1.5rem)); }
        }

        @keyframes marquee-right {
            0% { transform: translateX(calc(-100% - 1.5rem)); }
            100% { transform: translateX(0%); }
        }

        .animate-marquee-left {
            animation: marquee-left 60s linear infinite;
        }

        .animate-marquee-right {
            animation: marquee-right 60s linear infinite;
        }

        /* Light Mode Overrides - Comprehensive */
        html.light {
            background-color: #ffffff;
            color: #1a1a1a;
        }

        html.light * {
            color-scheme: light;
        }

        /* Background Colors */
        html.light .bg-\[#0b0f19\],
        html.light [class*="bg-slate-"],
        html.light [class*="bg-gray-900"],
        html.light [class*="bg-black"] {
            @apply bg-white;
        }

        html.light .bg-gradient-to-b,
        html.light .gradient-bg {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }

        html.light .bg-blue-600\/10,
        html.light [class*="bg-blue-"][class*="\/"] {
            background-color: rgba(59, 130, 246, 0.08) !important;
        }

        /* Text Colors */
        html.light .text-white {
            @apply text-slate-900;
        }

        html.light .text-gray-300 {
            @apply text-gray-700;
        }

        html.light .text-gray-400 {
            @apply text-gray-600;
        }

        html.light .text-gray-500 {
            @apply text-gray-700;
        }

        html.light .text-gray-600 {
            @apply text-gray-800;
        }

        /* Border Colors */
        html.light .border-white\/5,
        html.light .border-white\/10,
        html.light .border-white\/20 {
            @apply border-gray-300;
        }

        html.light .border-white\/30 {
            @apply border-gray-400;
        }

        /* Glass Effect */
        html.light .glass-effect {
            background: rgba(0, 0, 0, 0.03) !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        /* Semi-transparent backgrounds */
        html.light .bg-white\/5 {
            @apply bg-gray-50;
        }

        html.light .bg-white\/10 {
            @apply bg-gray-100;
        }

        html.light .bg-white\/20 {
            @apply bg-gray-200;
        }

        /* Specific UI Elements */
        html.light button {
            @apply text-white;
        }

        html.light input,
        html.light textarea,
        html.light select {
            @apply bg-white border-gray-300 text-slate-900;
        }

        html.light .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        html.light [class*="bg-blue-"] {
            filter: brightness(1.05);
        }

        /* Specific overrides for different sections */
        html.light [class*="section"] {
            background: white;
            color: #1a1a1a;
        }

        html.light h1, html.light h2, html.light h3, html.light h4, html.light h5, html.light h6 {
            @apply text-slate-900;
        }

        /* Card/Box backgrounds */
        html.light [class*="rounded-"] {
            background-color: white;
        }

        html.light .dark\: {
            color: #1a1a1a;
        }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>

</body>
